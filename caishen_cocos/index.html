<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>在线烧香 - 财神保佑</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
  </div>

  <!-- 加载 Cocos Creator 构建后的游戏脚本 -->
  <script src="build/cocos-jsb.js"></script>
  <script src="build/settings.js"></script>
  <script>
    window.onload = function() {
      // 启动游戏
      if (typeof cc !== 'undefined') {
        cc.game.onStart = function() {
          cc.view.setDesignResolutionSize(720, 1280, cc.ResolutionPolicy.SHOW_ALL);
          cc.view.resizeWithBrowserSize(true);
          cc.director.loadScene('LoadingScene');
        };
        cc.game.run();
      } else {
        console.error('Cocos Creator 引擎未加载，请确保构建正确');
      }
    };
  </script>
</body>
</html>
